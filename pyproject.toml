[project]
authors = [{name = "Jonas", email = "jonas.lederer@tu-berlin.de"}]
dependencies = ["cowpy>=1.1.5,<2"]
name = "hello_world"
requires-python = ">=3.11,<3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.scripts]
hello-world = "scripts.cli:main"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hello_world = { path = ".", editable = true }

[tool.pixi.tasks]
start = "python ./src/scripts/cli.py"
test = "pytest --cov=src --cov-report=term-missing"

[tool.pixi.dependencies]
pre-commit = ">=4.6.0,<5"
ruff = ">=0.15.11,<0.16"
pytest = ">=9,<10"
pytest-cov = ">=7,<8"
python-build = ">=1,<2"

[tool.ruff]
line-length = 88
target-version = "py311"
preview = true

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, B bugbear, UP pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
