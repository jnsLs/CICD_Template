[project]
authors = [{name = "Jonas", email = "jonas.lederer@tu-berlin.de"}]
dependencies = ["cowpy>=1.1.5,<2"]
name = "hello_world"
requires-python = ">=3.11,<3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.scripts]
hello-world = "scripts.cli:main"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hello_world = { path = ".", editable = true }

[tool.pixi.tasks]
start = "python ./src/scripts/cli.py"
test = "pytest"

[tool.pixi.dependencies]
pre-commit = ">=4.6.0,<5"
ruff = ">=0.15.11,<0.16"
pytest = ">=7.0,<8"

[tool.ruff]
line-length = 88
target-version = "py311"
preview = true

[tool.ruff.lint]
select = ["E", "F", "W"]
