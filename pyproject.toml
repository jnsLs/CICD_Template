[project]
authors = [{name = "Jonas", email = "jonas.lederer@tu-berlin.de"}]
dependencies = ["cowpy>=1.1.5,<2"]
name = "hello_world"
requires-python = ">=3.11,<3.14"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project.scripts]
hello-world = "scripts.cli:main"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
hello_world = { path = ".", editable = true }

[tool.pixi.tasks]
start = "python ./src/scripts/cli.py"
