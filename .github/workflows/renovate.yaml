name: Renovate

on:
  schedule:
    - cron: "0 * * * *"   # runs every hour
  workflow_dispatch:       # allows manual run

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.22
        with:
          token: ${{ secrets.GITHUB_TOKEN }}