name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # 1. Enforcement: Ensure only 'dev' merges into 'main'
  check_branch:
    name: Validate Branch Flow
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Enforce dev -> main flow
        if: github.head_ref != 'dev'
        run: |
          echo "ERROR: Direct merges to 'main' are restricted. PRs must come from 'dev'."
          exit 1

  # 2. Combined Quality Check: Linting & Testing
  tests:
    name: Lint & Test
    needs: check_branch
    # Only run tests if branch check passes (or isn't targeting main)
    if: always() && (needs.check_branch.result == 'success' || github.base_ref != 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          # Automatically caches the environment and verifies the lockfile
          cache: true
          frozen: true

      - name: Linting (Ruff)
        run: pixi run ruff check --output-format=github

      - name: Formatting Check
        run: pixi run ruff format --check .

      - name: Run Tests
        run: pixi run test
