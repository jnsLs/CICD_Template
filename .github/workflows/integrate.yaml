name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel older runs on the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Enforcement: Ensure only 'dev' merges into 'main'
  check_branch:
    name: Validate Branch Flow
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.base_ref == 'main'
    steps:
      - name: Enforce dev -> main flow
        if: github.head_ref != 'dev'
        run: |
          echo "ERROR: Direct merges to 'main' are restricted. PRs must come from 'dev'."
          exit 1

  # 2. Combined Quality Check: Linting & Testing
  tests:
    name: Lint & Test
    needs: check_branch
    # Only run tests if branch check passes (or isn't targeting main)
    if: always() && (needs.check_branch.result == 'success' || github.base_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          # Automatically caches the environment and verifies the lockfile
          cache: true
          frozen: true

      - name: Linting (Ruff)
        run: pixi run ruff check --output-format=github

      - name: Formatting Check
        run: pixi run ruff format --check .

      - name: Run Tests
        run: pixi run test --junitxml=pytest-results.xml --cov-report=xml

      # Upload regardless of pass/fail: junit XML helps debug failures,
      # coverage XML is most useful on green builds for tracking trends.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            pytest-results.xml
            coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false  # don't block the build if Codecov is down
