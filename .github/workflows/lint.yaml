name: Lint Python Code

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash

      - name: Install dependencies
        run: pixi install

      - name: Run pre-commit
        run: pixi run pre-commit run --all-files
