name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  testing:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash

      - name: Add Pixi to PATH
        run: echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Verify Pixi
        run: pixi --version

      - name: Install dependencies
        run: pixi install

      - name: Run Pytest
        run: pixi run test
