name: Release and Publish

on:
  release:
    types: [published] # Triggered only when a GitHub Release is created

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    # Required for OIDC authentication with PyPI
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
          frozen: true

      - name: Install build backend tooling
        run: pixi run python -m pip install --upgrade build

      - name: Build Package
        run: pixi run python -m build

      - name: Publish to PyPI
        # This action automatically detects OIDC if configured on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
