name: Release and Publish

on:
  release:
    types: [published] # Triggered only when a GitHub Release is created

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    # Optional hardening: gate releases on a GitHub Environment (add required
    # reviewers / wait timers under Settings -> Environments -> pypi).
    # environment: pypi
    # Required for OIDC authentication with PyPI
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          frozen: true

      # `build` is declared in pixi dependencies, so no extra pip install here —
      # it stays reproducible and pinned via pixi.lock.
      - name: Build Package
        run: pixi run python -m build

      - name: Publish to PyPI
        # This action automatically detects OIDC if configured on PyPI
        # -> no long-lived PYPI_API_TOKEN secret required
        uses: pypa/gh-action-pypi-publish@release/v1
