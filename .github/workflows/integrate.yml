name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel older runs on the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo (checkout) and uploads
# artifacts/coverage. Codecov uses its own token, so no write scopes needed.
permissions:
  contents: read

jobs:
  tests:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Automatically caches the environment and verifies the lockfile
          cache: true
          frozen: true

      - name: Linting (Ruff)
        run: pixi run ruff check --output-format=github

      - name: Formatting Check
        run: pixi run ruff format --check .

      - name: Run Tests
        run: pixi run test --junitxml=pytest-results.xml --cov-report=xml

      # Upload regardless of pass/fail: junit XML helps debug failures,
      # coverage XML is most useful on green builds for tracking trends.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            pytest-results.xml
            coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false  # don't block the build if Codecov is down
